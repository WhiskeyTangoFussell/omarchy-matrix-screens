# Matrix Screens palette: ethereal
#
# Bundled with the plugin. To change it, use Modify Color Palette in the bar panel;
# it saves ~/.config/omarchy/matrix-screens/ethereal.toml, which wins over this file.
# Rain background: the theme's own background (#060B1E); set background_color to change it.

color = "green"
head_color = "#ffcead"

#              periwinkle                | nebula orchid             | dawn gold-amber           | misty sky
tail_colors = "#c2c4f0, #7d82d9, #4f55a8 | #ead7e7, #c89dc1, #9a6a93 | #f7dc9c, #e9bb4f, #eb8b54 | #dfeaf0, #a3bfd1, #6d7db6"
