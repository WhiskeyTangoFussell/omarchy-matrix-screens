# Matrix Screens palette: tokyo-night
#
# Bundled with the plugin. To change it, use Modify Color Palette in the bar panel;
# it saves ~/.config/omarchy/matrix-screens/tokyo-night.toml, which wins over this file.
# Rain background: the theme's own background (#1a1b26); set background_color to change it.

color = "green"
head_color = "#ffffff"

#              pink                      | purple                    | blue
tail_colors = "#ff8fd8, #ff2fb9, #b8007f | #d59bff, #b14dff, #7400d6 | #8fd8ff, #1fb4ff, #0062d1"
