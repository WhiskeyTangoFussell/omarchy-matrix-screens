# Matrix Screens palette: hackerman
#
# Bundled with the plugin. To change it, use Modify Color Palette in the bar panel;
# it saves ~/.config/omarchy/matrix-screens/hackerman.toml, which wins over this file.
# Rain background: the theme's own background (#0B0C16); set background_color to change it.

color = "green"
head_color = "#ddf7ff"

#              green                     | blue                      | teal
tail_colors = "#9cf7c2, #4fe88f, #26a269 | #c4d2ed, #829dd4, #4a64a0 | #a4ffec, #50f7d4, #1f9e88"
